#endregion
#region services
  services:
    cockpit:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:9090"
        passHostHeader: true
    youtubedlmaterial:
      loadBalancer:
        servers:
          - url: "http://{{ traefik_backend_host }}:8998"
        passHostHeader: true
    sonarr:
      loadBalancer:
        servers:
          - url: "http://{{ traefik_backend_host }}:8989"
        passHostHeader: true
    radarr:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:7878"
        passHostHeader: true
    openbooks:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:8081"
        passHostHeader: true
    plex:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:32400"
        passHostHeader: true
    jellyfin:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:8896"
        passHostHeader: true
    heimdall:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:1080"
        passHostHeader: true
    deluge:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:8112"
        passHostHeader: true
    dashy:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:8082"
        passHostHeader: true
    calibre:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:8083"
        passHostHeader: true
    bazarr:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:6767"
        passHostHeader: true
    jackett:
      loadBalancer:
        servers:
          - url: "https://{{ traefik_backend_host }}:9117"
        passHostHeader: true
#endregion
  middlewares:
    #addprefix-pihole:
    #  addPrefix:
    #    prefix: "/admin"
    https-redirect:
      redirectScheme:
        scheme: https

    default-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipWhiteList:
        sourceRange:
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers
